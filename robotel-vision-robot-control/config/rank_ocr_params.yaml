# Documentation/reference values matching the provided source snapshot.
# This file is not loaded automatically by the extracted node.
realtime_rank_ocr_paddle:
  ros__parameters:
    camera_index: 0
    camera_width: 1280
    camera_height: 720
    camera_fps: 30.0
    camera_open_timeout_sec: 4.0
    image_topic: /hand_teleop/event_ocr_camera/image_raw
    rank_topic: /event/rank_ocr/detected
    start_service: /event/rank_ocr/start
    stop_service: /event/rank_ocr/stop
    result_service: /event/rank_ocr/result
    roi_config_file: rank_roi.json
    try_autofocus: true

# Source-level algorithm constants
algorithm:
  target_ranks: ["1등", "2등", "3등", "4등"]
  default_roi: [0.33, 0.40, 0.34, 0.20]
  ocr_every_n_frames: 4
  sharpest_frame_pool: 4
  vote_window: 12
  vote_min_count: 5
  vote_min_weight: 2.75
  vote_winner_margin: 0.45
  min_accept_score: 0.55
  min_ocr_visible_seconds: 2.0
